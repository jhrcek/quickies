<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Road to Yoneda</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js"></script>
    <style>
        :root {
            --accent: #1293D8;
            --accent-dark: #0b6ea6;
            --bg: #fafafa;
            --card: #ffffff;
            --border: #e0e0e0;
            --text: #222;
            --muted: #666;
            --ok: #2e8b57;
            --bad: #c0392b;
            --warn: #b7791f;
            --highlight: #fff3b0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.5;
        }

        .app { display: flex; min-height: 100vh; }

        .sidebar {
            width: 240px;
            flex-shrink: 0;
            background: #fff;
            border-right: 1px solid var(--border);
            padding: 16px 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .sidebar h1 { font-size: 1.1rem; margin: 0 16px 12px; color: var(--accent); }
        .sidebar a { display: block; padding: 6px 16px; color: var(--text); text-decoration: none; font-size: 0.92rem; }
        .sidebar a:hover { background: #f0f7fc; }
        .sidebar a.active { background: #e3f1fa; border-left: 3px solid var(--accent); padding-left: 13px; font-weight: 600; }
        .sidebar .num { color: var(--muted); display: inline-block; width: 1.4em; }

        .main { flex: 1; min-width: 0; }

        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 24px; border-bottom: 1px solid var(--border); background: #fff;
            font-size: 0.9rem; gap: 12px; flex-wrap: wrap;
        }

        .content { max-width: 900px; margin: 0 auto; padding: 24px; }
        .content h2 { margin-top: 0; }
        .content h3 { margin-top: 2em; border-bottom: 1px solid var(--border); padding-bottom: 4px; }

        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: 6px;
            padding: 16px; margin: 16px 0;
        }

        .callout { border-left: 4px solid var(--accent); background: #f0f7fc; padding: 10px 14px; margin: 16px 0; border-radius: 0 6px 6px 0; }
        .callout.remember { border-left-color: var(--warn); background: #fff8e6; }

        .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
        .col { flex: 1; min-width: 220px; }
        .col.fit { flex: 0 0 auto; max-width: 100%; overflow-x: auto; }
        .composition-status { display: flow-root; min-height: 9em; }

        .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
        .controls label { color: var(--muted); font-size: 0.9rem; }

        button {
            font: inherit; font-size: 0.9rem; padding: 4px 10px; border-radius: 4px;
            border: 1px solid var(--border); background: #fff; cursor: pointer;
        }
        button:hover { border-color: var(--accent); }
        button.active, button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        button:disabled { opacity: 0.5; cursor: default; }
        button.small { padding: 0 8px; min-width: 26px; line-height: 1.5; }

        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.82rem; margin-right: 6px; border: 1px solid; }
        .badge.ok { color: var(--ok); border-color: var(--ok); background: #eaf6ee; }
        .badge.bad { color: var(--bad); border-color: var(--bad); background: #fbeaea; }

        table.cayley { border-collapse: collapse; font-family: "KaTeX_Main", serif; }
        table.cayley th, table.cayley td {
            border: 1px solid var(--border); padding: 4px 10px; text-align: center; min-width: 2.2em; cursor: pointer;
        }
        table.cayley th { background: #f3f3f3; cursor: default; }
        table.cayley td.hl { background: var(--highlight); }
        table.cayley td.hl-strong { background: #ffd54f; font-weight: bold; }
        table.cayley th.hl { background: #e3f1fa; }
        table.cayley td.identity-cell { color: var(--accent-dark); }
        table.cayley td.empty { color: #bbb; cursor: default; }
        table.cayley th.band { color: #fff; font-weight: bold; padding: 2px 6px; min-width: 1.4em; }
        table.cayley th.gutter { background: none; border: none; }
        table.cayley .block-top { border-top: 2px solid #666; }
        table.cayley .block-left { border-left: 2px solid #666; }
        table.hom-table td { cursor: default; }
        ul.compact { margin: 4px 0; padding-left: 20px; }
        ul.compact li { margin: 2px 0; }

        .thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
        .thumb { border: 1px solid var(--border); border-radius: 4px; padding: 2px; background: #fff; cursor: pointer; }
        .thumb.selected { border-color: var(--accent); box-shadow: 0 0 0 2px #cfe6f5; }

        .prevnext { display: flex; justify-content: space-between; margin-top: 40px; padding-top: 16px; border-top: 1px solid var(--border); }
        .prevnext a { color: var(--accent); text-decoration: none; font-weight: 600; }

        svg text { user-select: none; }
        .content svg { max-width: 100%; height: auto; }

        dl.glossary dt { font-weight: 600; margin-top: 12px; }
        dl.glossary dd { margin: 2px 0 0 0; color: #333; }
        dl.glossary dt:target { background: var(--highlight); }
        .sidebar a.glossary { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
        .sidebar .sidebar-section {
            margin: 12px 0 2px; padding: 10px 16px 0; border-top: 1px solid var(--border);
            color: var(--muted); font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
        }

        .playground { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
        .playground-titlebar {
            display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
            padding: 4px 4px 4px 16px; border-bottom: 1px solid var(--border); background: #fff;
        }
        .playground-titlebar h2 { margin: 0; font-size: 0.95rem; font-weight: 600; }
        .playground-close {
            display: flex; align-items: center; justify-content: center; width: 32px; height: 32px;
            border-radius: 4px; color: var(--muted); text-decoration: none; font-size: 1.5rem; line-height: 1;
        }
        .playground-close:hover { background: var(--bad); color: #fff; }
        .playground-body { flex: 1; min-height: 0; overflow: auto; position: relative; }
        .pg-grid {
            display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
            height: 100%; gap: 1px; background: var(--border);
        }
        .pg-panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #fff; padding: 8px 12px; box-sizing: border-box; }
        .pg-panel-header { flex-shrink: 0; font-size: 0.9rem; }
        .pg-panel-header p { margin: 2px 0 4px; }
        .pg-panel-header .controls { margin: 0; }
        .pg-panel-header select { font: inherit; font-size: 0.9rem; padding: 2px 4px; }
        .pg-panel-body { flex: 1; min-height: 0; overflow: auto; display: flex; }
        .pg-panel-body > * { margin: auto; }
        .pg-panel-body > svg { width: auto; max-height: 100%; }
        table.cayley th.pg-pick { cursor: pointer; }
        table.cayley th.pg-pick:hover { filter: brightness(1.15); }
        table.cayley th.pg-picked { outline: 3px solid var(--text); outline-offset: -3px; }
        table.cayley .pg-dim { opacity: 0.3; cursor: default; }
        table.cayley .pg-pinned { outline: 2px solid var(--text); outline-offset: -2px; }

        .cc-page { max-width: 1400px; margin: 0 auto; padding: 4px 16px 24px; }
        .cc-page .card { margin: 12px 0; }
        .cc-page h3 { margin: 0 0 8px; font-size: 1rem; }
        .cc-main { flex: 3 1 480px; }
        .cc-side { flex: 2 1 340px; }
        .cc-chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 10px; border: 1px solid var(--border); border-radius: 14px; background: #fff; }
        button.cc-x { border: none; background: none; color: var(--muted); padding: 0 4px; font-size: 1rem; line-height: 1; }
        button.cc-x:hover:not(:disabled) { color: #fff; background: var(--bad); }
        .cc-arrow { display: inline-flex; align-items: center; margin-right: 6px; white-space: nowrap; }
        table.cayley td.cc-cell { text-align: left; cursor: default; white-space: nowrap; }
        button.cc-add { color: var(--accent-dark); margin-right: 6px; }
        table.cayley td.cc-warn { background: #fff8e6; outline: 2px solid var(--warn); outline-offset: -2px; }
        .cc-warnings li { color: #6b4a0f; }
        table.cc-composition td { cursor: default; padding: 2px 6px; }
        table.cc-composition select { font: inherit; font-size: 0.85rem; padding: 0 2px; }
        table.cayley td.cc-forced { color: var(--muted); }
        table.cayley td.cc-undecided { background: #fff8e6; }
        table.cayley td.cc-bad { background: #fbeaea; color: var(--bad); }
        .cc-ok { color: var(--ok); }
        .cc-error { color: var(--bad); }
        input.cc-name { font: inherit; font-size: 0.9rem; padding: 3px 6px; border: 1px solid var(--border); border-radius: 4px; min-width: 14em; }
        ul.cc-saved li { margin: 6px 0; }
        .badge.kind { color: var(--accent-dark); border-color: var(--accent); background: #f0f7fc; cursor: help; }
        .picker-yours { margin-left: 8px; }
        .picker-links { margin-left: 8px; font-size: 0.85rem; white-space: nowrap; }
        .picker-links a { color: var(--accent); text-decoration: none; margin-right: 10px; }
        .picker-links a:hover { text-decoration: underline; }
        .fp-set { display: flex; gap: 8px; align-items: baseline; margin: 4px 0; }
        .fp-set-buttons { flex: 0 0 auto; display: flex; gap: 4px; }
        table.fp-functions th.fp-arrow { text-align: left; white-space: nowrap; }
        table.fp-functions td { cursor: default; padding: 2px 8px; white-space: nowrap; }
        table.fp-functions select { font: inherit; font-size: 0.85rem; padding: 0 2px; }
        button.cc-danger { background: var(--bad); border-color: var(--bad); color: #fff; }

        @media (max-width: 800px) {
            .app { flex-direction: column; }
            .sidebar {
                width: auto; height: auto; position: static;
                border-right: none; border-bottom: 1px solid var(--border);
                padding: 8px 8px 4px;
                display: flex; flex-wrap: wrap; gap: 2px 4px; align-items: center;
            }
            .sidebar h1 { flex: 1 0 100%; margin: 0 8px 6px; }
            .sidebar a { padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; }
            .sidebar a.active { border-left: none; padding-left: 8px; }
            .sidebar a.glossary { margin-top: 0; border-top: none; padding-top: 4px; }
            .sidebar .sidebar-section { flex: 1 0 100%; margin: 4px 0 0; padding: 4px 8px 0; }
            .pg-grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; height: auto; }
            .pg-panel-body > svg { max-height: 70vh; }
            .sidebar .num { width: auto; margin-right: 4px; }
            .topbar { padding: 8px 16px; }
            .content { padding: 16px; }
            .col { min-width: 160px; }
            .card { padding: 12px; overflow-x: auto; }
        }
        .muted { color: var(--muted); }
        code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; }
    </style>
</head>

<body>
    <div id="app"></div>

    <script>
        class MathTex extends HTMLElement {
            static get observedAttributes() { return ['formula', 'display-mode']; }
            connectedCallback() { this._render(); }
            attributeChangedCallback() { this._render(); }
            _render() {
                const tex = this.getAttribute('formula') || '';
                const displayMode = this.getAttribute('display-mode') !== 'false';
                try { katex.render(tex, this, { displayMode, throwOnError: false }); }
                catch (e) { this.textContent = tex; }
            }
        }
        customElements.define('math-tex', MathTex);
    </script>

    <script src="elm.min.js"></script>
    <script>
        // custom categories and functors from the playgrounds, see Ports.elm
        const categoriesKey = 'yoneda.customCategories';
        const functorsKey = 'yoneda.customFunctors';
        const load = key => { try { return localStorage.getItem(key); } catch (e) { return null; } };
        const store = key => json => { try { localStorage.setItem(key, json); } catch (e) { } };
        const app = Elm.Main.init({
            node: document.getElementById('app'),
            flags: { categories: load(categoriesKey), functors: load(functorsKey) }
        });
        app.ports.storeCustomCategories.subscribe(store(categoriesKey));
        app.ports.storeCustomFunctors.subscribe(store(functorsKey));
    </script>
</body>

</html>
