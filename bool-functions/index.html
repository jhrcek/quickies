<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boolean Function Explorer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.js"></script>
    <style>
        graphviz-graph:not(:defined) {
            display: block;
            min-height: 200px;
            background: #f0f0f0;
            border-radius: 4px;
        }

        graphviz-graph:not(:defined)::before {
            content: "Loading graph...";
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            color: #888;
        }
    </style>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/@viz-js/viz@3.31/dist/viz-global.js"></script>

    <script>
        const vizPromise = Viz.instance();

        class GraphvizGraph extends HTMLElement {
            static get observedAttributes() {
                return ['graph', 'engine'];
            }

            constructor() {
                super();
                this.attachShadow({ mode: 'open' });
            }

            connectedCallback() {
                this.render();
            }

            attributeChangedCallback(name, oldValue, newValue) {
                if ((name === 'graph' || name === 'engine') && oldValue !== newValue) {
                    this.render();
                }
            }

            async render() {
                const graphAttr = this.getAttribute('graph');
                if (!graphAttr) {
                    this.shadowRoot.innerHTML = '<div style="color: #999;">No graph specified</div>';
                    return;
                }

                try {
                    const graphObject = JSON.parse(graphAttr);
                    const engine = this.getAttribute('engine') || 'dot';
                    const viz = await vizPromise;
                    const svgElement = viz.renderSVGElement(graphObject, { engine });

                    this.shadowRoot.innerHTML = '';
                    this.shadowRoot.appendChild(svgElement);

                    svgElement.style.maxWidth = '100%';
                    svgElement.style.height = 'auto';
                } catch (error) {
                    console.error('Graphviz render error:', error);
                    const errorBox = document.createElement('div');
                    errorBox.style.cssText = 'color: #c00; padding: 10px; background: #fee; border-radius: 4px;';
                    const label = document.createElement('strong');
                    label.textContent = 'Render Error:';
                    errorBox.append(label, ' ', error.message);
                    this.shadowRoot.replaceChildren(errorBox);
                }
            }
        }

        customElements.define('graphviz-graph', GraphvizGraph);

        class MathTex extends HTMLElement {
            static get observedAttributes() { return ['formula', 'display-mode']; }
            connectedCallback() { this._render(); }
            attributeChangedCallback() { this._render(); }
            _render() {
                const tex = this.getAttribute('formula') || '';
                const displayMode = this.getAttribute('display-mode') !== 'false';
                try { katex.render(tex, this, { displayMode, throwOnError: false }); }
                catch (e) { this.textContent = tex; }
            }
        }
        customElements.define('math-tex', MathTex);
    </script>

    <script src="elm.min.js"></script>
    <script>Elm.Main.init();</script>
</body>

</html>
